[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cablerobot"
version = "0.1.0"
description = "Generic multibody models and numerical tools for cable-driven robots"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CableRobot contributors"}]
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["cablerobot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
