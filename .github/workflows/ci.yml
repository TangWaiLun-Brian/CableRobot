name: Tests and package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      # Pins verified from the official actions repositories, 2026-10-05:
      # https://github.com/actions/checkout and https://github.com/actions/setup-python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test with warnings as errors
        run: python -m pytest -q -W error
      - name: Spatial example
        run: python -m examples.spatial_cdpr --output examples/output/cdpr.png
      - name: Serial example
        run: python -m examples.serial_robot --output examples/output/serial.png
      - name: Pose-dependent equilibrium allocation
        run: python -m examples.equilibrium_allocation --samples 9 --output-dir examples/output/equilibrium
      - name: Pipeline benchmark correctness smoke (no timing threshold)
        run: python -m benchmarks.control_pipeline --frames 20 --repeats 1 --profile-frames 3 --output-dir examples/output/performance/ci
      - name: Best-effort feasibility-boundary smoke
        run: python -m examples.best_effort_allocation --samples 9 --output-dir examples/output/best_effort/ci
      - name: FK predictor correctness smoke (no timing threshold)
        run: python -m benchmarks.fk_prediction --frames 64 --repeats 1 --require-convergence --output-dir examples/output/fk_prediction/ci
      - name: Short three-topology GIF smoke test
        run: python -m examples.animate_robots --duration 0.3 --fps 10 --format gif --output-dir examples/output/ci
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Whitespace check
        run: git diff --check
